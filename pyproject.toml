[project]
name = "mcp-cdp"
version = "0.1.0"
description = "Local AutoML workspace with chat and MCP control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "openai>=1.50",
  "anthropic>=0.39",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
mcp-cdp = "app.main:run"
mcp-cdp-stdio = "app.mcp.stdio_bridge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
